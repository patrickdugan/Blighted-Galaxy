name: BG-PHY-12 radial stellar equilibrium A/B
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - "src/sph_adaptive.rs"
      - "src/stellar_balance.rs"
      - "src/stellar_relax.rs"
      - "src/bin/phy12_bench.rs"
      - ".github/workflows/bg-phy12.yml"
  push:
    branches: [main]
    paths:
      - "src/sph_adaptive.rs"
      - "src/stellar_balance.rs"
      - "src/stellar_relax.rs"
      - "src/bin/phy12_bench.rs"
      - ".github/workflows/bg-phy12.yml"
  workflow_dispatch:
jobs:
  radial_balance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 512-particle matched-duration tapered damping comparison
        run: |
          cargo run --release --bin phy12_bench -- \
            --n 512 --relax-steps 600 --hold-steps 788 \
            --csv bg-phy12-timeseries.csv \
            --shell-csv bg-phy12-shells.csv
      - name: Publish pressure-gravity and undamped stability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy12-512-reference
          path: |
            bg-phy12-timeseries.csv
            bg-phy12-shells.csv
          if-no-files-found: warn
          retention-days: 30
