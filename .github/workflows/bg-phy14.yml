name: BG-PHY-14 growing-neighbor consistency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - "src/sph_hroot.rs"
      - "src/sph_adaptive.rs"
      - "src/sph_sampling.rs"
      - "src/bin/phy14_bench.rs"
      - ".github/workflows/bg-phy14.yml"
  push:
    branches: [main]
    paths:
      - "src/sph_hroot.rs"
      - "src/sph_adaptive.rs"
      - "src/sph_sampling.rs"
      - "src/bin/phy14_bench.rs"
      - ".github/workflows/bg-phy14.yml"
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - n: 256
            seeds: "0,17"
          - n: 512
            seeds: "0,17"
          - n: 1024
            seeds: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Matched-duration growing-neighbor SPH and closure audit
        run: |
          cargo run --release --bin phy14_bench -- \
            --n ${{ matrix.n }} --seeds ${{ matrix.seeds }} \
            --fixed-eta 1.2 --growth-base-n 256 --growth-base-eta 1.05 \
            --relax-steps 300 --hold-steps 788 --dt 0.01 \
            --csv bg-phy14-${{ matrix.n }}.csv
      - name: Upload neighbor-scaling, root and stability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy14-n${{ matrix.n }}
          path: |
            bg-phy14-${{ matrix.n }}.csv
          if-no-files-found: warn
          retention-days: 30
