name: BG-STR-06 episodes, Patricia Trie, M3 boxing and persistence checks
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'src/strategy.rs'
      - 'src/patricia_trie.rs'
      - 'src/episodes.rs'
      - 'src/morph_boxing.rs'
      - 'src/guf_geometry.rs'
      - 'src/campaign_save.rs'
      - 'src/overworld.rs'
      - 'src/mission.rs'
      - 'src/si_bridge.rs'
      - 'src/main.rs'
      - 'src/overworld_nav.rs'
      - 'src/lib.rs'
      - 'workpapers/strategy/**'
      - '.github/workflows/bg-strategy.yml'
  workflow_dispatch:
jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo check --all-targets
