name: BG-PHY-19 quadratic surface pressure and enthalpy diagnostics
on:
  pull_request:
    paths:
      - "src/sph_quadratic_audit.rs"
      - "src/bin/phy19_bench.rs"
      - "src/sph_gradient_audit.rs"
      - "src/sph_neighbor_calibration.rs"
      - ".github/workflows/bg-phy19.yml"
  push:
    branches: [main]
    paths:
      - "src/sph_quadratic_audit.rs"
      - "src/bin/phy19_bench.rs"
      - ".github/workflows/bg-phy19.yml"
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - n: 256
            seeds: "0,17"
          - n: 1024
            seeds: "0,17"
          - n: 2048
            seeds: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Frozen quadratic pressure and enthalpy comparison
        run: |
          cargo run --release --bin phy19_bench -- \
            --n ${{ matrix.n }} --seeds ${{ matrix.seeds }} \
            --targets 100,150,200 --glass-sweeps 20 \
            --calibration-steps 12 \
            --csv bg-phy19-${{ matrix.n }}.csv
      - name: Upload polynomial reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy19-n${{ matrix.n }}
          path: bg-phy19-${{ matrix.n }}.csv
          if-no-files-found: warn
          retention-days: 30
