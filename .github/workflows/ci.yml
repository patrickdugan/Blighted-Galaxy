name: Rust prototype
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, "recovery/**", "feat/**"]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo check --all-targets
      - run: cargo run --bin physics_bench
      - run: cargo run --bin strongfield_bench
      - run: cargo run --bin kerr_sph3_bench
      - run: cargo run --release --bin optical_relax_bench -- --csv bg-phy07-relax-convergence.csv --optical-csv bg-phy07-kerr-path.csv
      - run: cargo run --release --bin phy08_bench -- --csv bg-phy08-adaptive.csv
      - run: cargo run --release --bin phy09_bench -- --csv bg-phy09-comparison.csv
      - run: cargo run --release --bin phy10_bench -- --csv bg-phy10-comparison.csv
      - run: cargo run --release --bin phy11_bench -- --n 64 --relax-steps 20 --hold-steps 30 --csv bg-phy11-smoke.csv
      - run: cargo run --release --bin phy12_bench -- --n 64 --relax-steps 20 --hold-steps 30 --csv bg-phy12-smoke.csv --shell-csv bg-phy12-smoke-shells.csv
      - run: cargo run --release --bin phy13_bench -- --n 64 --etas 0.85,1.20 --relax-steps 20 --hold-steps 30 --csv bg-phy13-smoke.csv --shell-csv bg-phy13-smoke-shells.csv
      - run: cargo run --release --bin phy14_bench -- --n 64 --seeds 0 --relax-steps 10 --hold-steps 20 --csv bg-phy14-smoke.csv
      - run: cargo run --release --bin phy14_bench -- --n 32 --seeds 0 --relax-steps 4 --hold-steps 8 --root-dynamics --csv bg-phy14-newton-smoke.csv
      - run: cargo run --release --bin phy15_bench -- --n 64 --seeds 0 --relax-steps 6 --shells 8 --csv bg-phy15-smoke.csv --shell-csv bg-phy15-smoke-shells.csv
      - run: cargo run --release --bin phy16_bench -- --n 64 --seeds 0 --glass-sweeps 6 --relax-steps 8 --root-compare --shells 8 --csv bg-phy16-smoke.csv --shell-csv bg-phy16-smoke-shells.csv
      - run: cargo run --release --bin phy17_bench -- --n 64 --seeds 0 --targets 20,32 --calibration-steps 6 --glass-sweeps 4 --shells 4 --csv bg-phy17-smoke.csv --shell-csv bg-phy17-smoke-shells.csv
      - run: cargo run --release --bin phy17_hold -- --n 64 --seed 0 --layout shell --kernel c4 --target-neighbors 0 --fixed-eta 1.2 --relax-steps 4 --hold-steps 8 --dt 0.01 --csv bg-phy17-hold-smoke.csv --trace-csv bg-phy17-hold-smoke-trace.csv
      - name: Upload BG-PHY-17 short physical-hold smoke
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy17-hold-smoke
          path: |
            bg-phy17-hold-smoke.csv
            bg-phy17-hold-smoke-trace.csv
          if-no-files-found: error
          retention-days: 30
      - run: cargo run --release --bin phy18_bench -- --n 64 --seeds 0 --targets 20,32 --glass-sweeps 4 --calibration-steps 6 --csv bg-phy18-smoke.csv
      - run: cargo run --release --bin phy19_bench -- --n 64 --seeds 0 --targets 20,32 --glass-sweeps 4 --calibration-steps 6 --csv bg-phy19-smoke.csv
      - run: cargo run --release --bin phy20_bench -- --n 64 --seeds 0 --targets 20,32 --glass-sweeps 4 --calibration-steps 6 --csv bg-phy20-smoke.csv
      - name: Upload BG-PHY-20 frozen-density smoke
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy20-smoke
          path: bg-phy20-smoke.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-19 quadratic gradient smoke
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy19-smoke
          path: bg-phy19-smoke.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-18 gradient consistency smoke
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy18-smoke
          path: bg-phy18-smoke.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-17 calibrated-neighbour smoke
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy17-smoke
          path: |
            bg-phy17-smoke.csv
            bg-phy17-smoke-shells.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-16 kernel/glass numerical smoke
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy16-smoke
          path: |
            bg-phy16-smoke.csv
            bg-phy16-smoke-shells.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-15 frozen-force smoke
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy15-smoke
          path: |
            bg-phy15-smoke.csv
            bg-phy15-smoke-shells.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-14 numerical root/neighbor smoke
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy14-smoke
          path: |
            bg-phy14-smoke.csv
            bg-phy14-newton-smoke.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-13 smoothing-length smoke
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy13-smoke
          path: |
            bg-phy13-smoke.csv
            bg-phy13-smoke-shells.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-12 force-balance smoke
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy12-force-balance-smoke
          path: |
            bg-phy12-smoke.csv
            bg-phy12-smoke-shells.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-11 smoke diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy11-smoke
          path: bg-phy11-smoke.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-10 kernel gravity and shell comparison
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy10-reference
          path: bg-phy10-comparison.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-09 matched gravity comparison
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy09-reference
          path: bg-phy09-comparison.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-08 adaptive reference
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy08-adaptive-reference
          path: bg-phy08-adaptive.csv
          if-no-files-found: error
          retention-days: 30
      - name: Upload BG-PHY-07 numerical reference
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy07-numerical-reference
          path: |
            bg-phy07-relax-convergence.csv
            bg-phy07-kerr-path.csv
          if-no-files-found: error
          retention-days: 30
      - run: cargo run --release --bin kerr_camera_bench -- --output kerr-camera-smoke.png
      - run: cargo run --release --bin kerr_camera_bench -- --width 320 --height 200 --span 86 --inclination 65 --output kerr-camera-wide.png
      - run: cargo run --release --bin white_dwarf_bench -- --output wd-mass-radius.csv
      - name: Upload physics reference outputs
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy06-physics-reference
          path: |
            kerr-camera-smoke.png
            kerr-camera-wide.png
            wd-mass-radius.csv
          if-no-files-found: error
          retention-days: 30
      - run: cargo test si_bridge -- --nocapture

  windows-playable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows game
        run: cargo build --release
      - name: Upload playable Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: blighted-galaxy-windows-x64
          path: |
            target/release/blighted-galaxy.exe
            target/release/arcade_legacy.exe
            target/release/si_orbits.exe
            target/release/physics_bench.exe
            target/release/strongfield_lab.exe
            target/release/strongfield_bench.exe
            target/release/kerr_sph3_lab.exe
            target/release/kerr_sph3_bench.exe
            target/release/kerr_camera_lab.exe
            target/release/kerr_camera_bench.exe
            target/release/white_dwarf_lab.exe
            target/release/kerr_optical_lab.exe
            target/release/optical_relax_bench.exe
            target/release/phy08_bench.exe
            target/release/phy09_bench.exe
            target/release/phy10_bench.exe
            target/release/phy11_bench.exe
            target/release/phy12_bench.exe
            target/release/phy13_bench.exe
            target/release/phy14_bench.exe
            target/release/phy15_bench.exe
            target/release/phy16_bench.exe
            target/release/phy17_bench.exe
            target/release/phy17_hold.exe
            target/release/phy18_bench.exe
            target/release/phy19_bench.exe
            target/release/phy20_bench.exe
            target/release/kerr_moving_lab.exe
            target/release/white_dwarf_bench.exe
          if-no-files-found: error
          retention-days: 30
