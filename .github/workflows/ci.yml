name: Rust prototype
on:
  push:
    branches: [main, "recovery/**", "feat/**"]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo check --all-targets
      - run: cargo run --bin physics_bench
      - run: cargo run --bin strongfield_bench
      - run: cargo run --bin kerr_sph3_bench
      - run: cargo run --release --bin kerr_camera_bench -- --output kerr-camera-smoke.png
      - run: cargo run --release --bin kerr_camera_bench -- --width 320 --height 200 --span 86 --inclination 65 --output kerr-camera-wide.png
      - run: cargo run --release --bin white_dwarf_bench -- --output wd-mass-radius.csv
      - name: Upload physics reference outputs
        uses: actions/upload-artifact@v4
        with:
          name: bg-phy06-physics-reference
          path: |
            kerr-camera-smoke.png
            kerr-camera-wide.png
            wd-mass-radius.csv
          if-no-files-found: error
          retention-days: 30
      - run: cargo test si_bridge -- --nocapture

  windows-playable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows game
        run: cargo build --release
      - name: Upload playable Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: blighted-galaxy-windows-x64
          path: |
            target/release/blighted-galaxy.exe
            target/release/arcade_legacy.exe
            target/release/si_orbits.exe
            target/release/physics_bench.exe
            target/release/strongfield_lab.exe
            target/release/strongfield_bench.exe
            target/release/kerr_sph3_lab.exe
            target/release/kerr_sph3_bench.exe
            target/release/kerr_camera_lab.exe
            target/release/kerr_camera_bench.exe
            target/release/white_dwarf_lab.exe
            target/release/white_dwarf_bench.exe
          if-no-files-found: error
          retention-days: 30
